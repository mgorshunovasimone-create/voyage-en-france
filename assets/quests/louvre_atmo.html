<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Louvre, cour Marly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#17201b; --panel:#1f2a24; --ink:#f3ead8; --muted:#b9ad95;
  --slate:#232826; --chalk:#f6f1e4; --brass:#c89a4a; --line:rgba(243,234,216,.14); --gm:#9cc3e8; --gf:#f0a3b4;
}
:root[data-theme="light"]{ --bg:#efe7d6; --panel:#f7f1e4; --ink:#2a2219; --muted:#6e604c; --line:rgba(42,34,25,.15); --gm:#2f6ea6; --gf:#b0405c; }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#efe7d6; --panel:#f7f1e4; --ink:#2a2219; --muted:#6e604c; --line:rgba(42,34,25,.15); --gm:#2f6ea6; --gf:#b0405c; }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Work Sans",system-ui,-apple-system,sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 40px;display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:32px;align-items:start}
@media (min-width:821px){ .scene{width:min(100%,calc((100vh - 48px) * 0.5617))} .side{position:sticky;top:24px} }
@media (max-width:820px){ .wrap{grid-template-columns:1fr;gap:20px;padding-top:16px} }

.scene{position:relative;width:100%;justify-self:center;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.35);touch-action:manipulation}
.scene img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.spot{fill:rgba(255,246,225,0);stroke:rgba(255,246,225,0);stroke-width:4;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s,stroke .15s}
.spot:hover,.spot.active{fill:rgba(255,246,225,.14);stroke:rgba(255,246,225,.95);stroke-width:2}
.spot:focus{outline:none}
.spot:focus-visible{stroke:#fff;stroke-width:3}
.show-all .spot{stroke:rgba(255,246,225,.55);stroke-width:1.5;stroke-dasharray:5 4}
.show-all .spot:hover,.show-all .spot.active{stroke-dasharray:none;stroke-width:2}

.tip{position:absolute;z-index:5;pointer-events:none;min-width:200px;max-width:280px;padding:12px 14px 13px;
  background:var(--slate);color:var(--chalk);border-radius:4px;border:3px solid #6b4a2b;
  box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transform:translate(-50%,-100%) translateY(-6px);transition:opacity .12s}
.tip.show{opacity:1}
.tip.below{transform:translate(-50%,0) translateY(6px)}
.tip .fr{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:500;font-size:1.3rem;line-height:1.2}
.tip .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-top:4px;font-size:.88rem;color:#d7cfbd}
.tip .g{font-size:.72rem;padding:1px 6px;border-radius:10px;border:1px solid currentColor;letter-spacing:.02em}
.g-m{color:#9cc3e8} .g-f{color:#f0a3b4}
.tip .spec{margin-top:8px;padding-top:7px;border-top:1px dashed rgba(246,241,228,.25);font-size:.85rem;line-height:1.35}
.tip .spec .lbl{display:block;font-size:.72rem;color:#a9a18f;margin-bottom:2px}
.tip .spec .sfr{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1rem}
.tip .spec .sg{font-size:.68rem;padding:0 5px;border-radius:9px;border:1px solid currentColor;margin-left:4px}
.tip .spec .sru{display:block;color:#d7cfbd}
.carnet .sub{display:block;font-size:.82rem;opacity:.85}
.tip .note{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(246,241,228,.25);font-size:.82rem;line-height:1.4;color:#e6dfcf}

.side h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(1.6rem,3.2vw,2.2rem);line-height:1.1;margin:4px 0 8px}
.side .lead{color:var(--muted);margin:0 0 20px;max-width:40ch}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.count{font-family:Fraunces,Georgia,serif;font-size:1.1rem}
.count b{font-weight:600}
.progress{flex:1 1 120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:100px}
.progress i{display:block;height:100%;width:0;background:var(--brass);transition:width .3s}
button.toggle{font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
button.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button.toggle:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.carnet{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.carnet li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.carnet li:hover{background:rgba(200,154,74,.08)}
.carnet .w{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.05rem}
.carnet .t{color:var(--muted);font-size:.9rem;grid-column:1}
.carnet .g{grid-row:1/3;grid-column:2;align-self:center;font-size:.72rem;padding:1px 7px;border-radius:10px;border:1px solid currentColor}
.carnet .g-m,.legend .g-m{color:var(--gm)} .carnet .g-f,.legend .g-f{color:var(--gf)}
.empty{color:var(--muted);font-size:.95rem;padding:14px 2px}
.legend{margin-top:14px;font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
